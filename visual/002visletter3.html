<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visual Tracking – Word Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1rem;
      background: #111;
      color: #f5f5f5;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }

    .controls {
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    label {
      font-size: 0.9rem;
    }

    input[type="number"] {
      padding: 0.25rem 0.4rem;
      font-size: 0.9rem;
    }

    button {
      padding: 0.4rem 0.7rem;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #f5f5f5;
    }

    button:hover {
      background: #333;
    }

    .status-bar {
      margin: 0.5rem 0 1rem 0;
      font-size: 0.95rem;
    }

    .status-highlight {
      font-weight: bold;
      color: #ffd966;
      word-break: break-all;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      max-width: 100%;
      overflow-x: auto;
      padding-bottom: 1rem;
    }

    .row-wrapper {
      display: flex;
      align-items: center;
    }

    .row-label {
      min-width: 3rem;
      text-align: right;
      padding-right: 0.5rem;
      font-size: 0.9rem;
      color: #bbb;
    }

    .row {
      display: flex;
      gap: 0.25rem;
      white-space: nowrap;
      font-size: 1rem;
    }

    .cell {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 3.2rem;
      padding: 0 0.4rem;
      height: 1.8rem;
      border-radius: 4px;
      user-select: none;
      border: 1px solid transparent;
      transition: background 0.1s ease, border-color 0.1s ease;
    }

    .cell button {
      all: unset;
      width: 100%;
      height: 100%;
      text-align: center;
      cursor: pointer;
    }

    .cell:focus-within {
      outline: 2px solid #ffd966;
      outline-offset: 2px;
    }

    .cell.correct {
      background: #144d2a;
      border-color: #35b36b;
    }

    .cell.wrong {
      background: #5a1111;
      border-color: #ff6666;
    }

    .results {
      font-size: 0.9rem;
      border-top: 1px solid #333;
      padding-top: 0.5rem;
    }

    .results strong {
      color: #ffd966;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <h1>Visual Tracking – Word Search</h1>

  <p style="font-size:0.9rem;max-width:48rem;">
    Each row contains several words. One word in each row is the target for that row.
    Your task: for row 1, click the target shown below; then row 2, and so on.
    This is a prototype and not a clinical tool.
  </p>

  <div class="controls">
    <label>
      Rows:
      <input type="number" id="rowsInput" min="3" max="60" value="12">
    </label>
    <label>
      Words per row:
      <input type="number" id="cellsInput" min="6" max="40" value="18">
    </label>
    <button id="startBtn">Start / Reset</button>
  </div>

  <div class="status-bar" aria-live="polite">
    Current target: <span id="targetDisplay" class="status-highlight">example</span> ·
    Row <span id="rowDisplay" class="status-highlight">1</span> of
    <span id="rowTotalDisplay">12</span> ·
    Errors: <span id="errorDisplay" class="status-highlight">0</span>
  </div>

  <div id="grid" class="grid" role="list" aria-label="Word rows"></div>

  <div class="results" id="results" aria-live="polite"></div>

  <script>
    (function () {
      // Common English words, mostly 3+ letters, general vocabulary

        "decide","decision","deep","degree","deliver","demand","depend","design","detail","develop",
        "difference","difficult","dinner","direction","director","discover","discuss","disease","distance",
        "district","divide","doctor","document","doubt","draw","dream","dress","drink","drive",
        "drop","during","early","earth","east","easy","edge","effect","effort","eight",
        "either","election","else","employee","enemy","energy","enjoy","enough","enter","entire",
        "environment","equal","especially","establish","event","every","exact","example","exist","expect",
        "experience","expert","explain","face","fact","factor","fail","fall","family","farm",
        "fast","father","fear","feature","feel","feeling","field","fight","figure","fill",
        "film","final","financial","find","fine","finish","fire","firm","first","fish",
        "floor","follow","food","foot","force","foreign","forest","forget","form","forward",
        "four","free","friend","front","full","function","fund","future","game","garden",
        "gas","gather","general","generation","girl","give","glass","goal","good","government",
        "grab","grade","great","green","ground","group","grow","growth","guess","hair",
        "half","hand","happen","happy","hard","harm","head","health","hear","heart",
        "heat","heavy","help","here","hide","high","history","hold","home","hope",
        "horse","hospital","hour","house","human","hundred","husband","idea","identify","image",
        "imagine","impact","important","improve","include","income","increase","indeed","indicate","individual",
        "industry","information","inside","instead","institution","interest","interesting","international","interview",
        "into","introduce","issue","item","itself","job","join","journey","judge","keep",
        "key","kill","kind","kitchen","knowledge","land","language","large","last","late",
        "later","laugh","law","lawyer","lead","leader","learn","least","leave","left",
        "legal","less","letter","level","life","light","like","likely","limit","line",
        "list","listen","little","live","local","long","look","lose","loss","lot",

        "partner","party","pass","past","patient","pattern","pay","peace","people","perform",
        "performance","perhaps","period","person","personal","phone","physical","pick","picture","piece",
        "place","plan","plant","play","player","point","police","policy","political","politics",
        "poor","popular","population","position","positive","possible","power","practice","prepare","present",
        "president","press","pressure","pretty","prevent","price","private","probably","problem","process",
        "produce","product","production","professional","professor","program","project","property","protect","prove",
        "provide","public","pull","purpose","push","quality","quarter","question","quickly","quite",
        "race","radio","raise","range","rate","rather","reach","read","ready","real",
        "reality","realize","really","reason","receive","recent","recently","recognize","record","reduce",
        "reflect","region","relate","relationship","religious","remain","remember","remove","report","represent",
        "republic","require","research","resource","respond","response","responsibility","rest","result","return",
        "reveal","rise","risk","road","rock","role","room","rule","safe","same",
        "save","scene","school","science","scientist","score","season","seat","second","section",
        "security","seek","seem","sell","senior","sense","series","serious","serve","service",
        "seven","several","shake","share","shoot","short","shoulder","show","side","sign",
        "significant","similar","simple","simply","since","single","sister","sit","site","situation",
        "size","skill","skin","small","smile","social","society","soldier","somebody","someone",
        "something","sometimes","song","soon","sort","sound","source","south","southern","space",
        "speak","special","specific","speech","spend","sport","spring","staff","stage","stand",
        "standard","star","start","state","statement","station","stay","step","still","stock",
        "stop","store","story","strategy","street","strong","structure","student","study","stuff",
        "style","subject","success","successful","such","suddenly","suffer","suggest","summer","support",
        "sure","surface","system","table","take","talk","task","tax","teach","teacher",
        "team","technology","television","tell","tend","term","test","than","thank","that",
        "their","them","themselves","then","theory","there","these","they","thing","think",
        "third","this","those","though","thought","thousand","threat","three","through","throughout",
        "throw","thus","time","today","together","tonight","too","top","total","tough",
        "toward","town","trade","traditional","training","travel","treat","treatment","tree","trial",
        "trip","trouble","true","truth","turn","type","under","understand","unit","until",
        "upon","use","usually","value","various","very","victim","view","violence","visit",
        "voice","vote","wait","walk","wall","want","war","watch","water","way",
        "weapon","wear","week","weight","well","west","western","what","whatever","when",
        "where","whether","which","while","white","whole","whom","whose","why","wide",
        "wife","will","wind","window","wish","with","within","without","woman","wonder",
        "word","work","worker","world","worry","would","write","writer","wrong","yard",
        "yeah","year","yes","yet","young","your","yourself"
      ];

      const MIN_WORD_LEN = 3;
      const MAX_WORD_LEN = 16;

      const gridEl = document.getElementById("grid");
      const rowsInput = document.getElementById("rowsInput");
      const cellsInput = document.getElementById("cellsInput");
      const startBtn = document.getElementById("startBtn");

      const targetDisplay = document.getElementById("targetDisplay");
      const rowDisplay = document.getElementById("rowDisplay");
      const rowTotalDisplay = document.getElementById("rowTotalDisplay");
      const errorDisplay = document.getElementById("errorDisplay");
      const resultsEl = document.getElementById("results");

      let totalRows = 12;
      let cellsPerRow = 18;
      let currentRowIndex = 0;
      let currentTarget = "";
      let errorCount = 0;
      let startTime = null;
      let finished = false;
      let targetWords = [];
      let candidateWords = [];

      function filterCandidates() {
        candidateWords = WORD_LIST.filter(function (w) {
          return w.length >= MIN_WORD_LEN && w.length <= MAX_WORD_LEN;
        });
      }

      function shuffleInPlace(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = arr[i];
          arr[i] = arr[j];
          arr[j] = tmp;
        }
      }

      function chooseTargets(n) {
        if (n > candidateWords.length) {
          n = candidateWords.length;
        }
        const pool = candidateWords.slice();
        shuffleInPlace(pool);
        return pool.slice(0, n);
      }

      function randomFiller(excludeWord) {
        if (candidateWords.length === 0) return excludeWord;
        let w;
        do {
          w = candidateWords[Math.floor(Math.random() * candidateWords.length)];
        } while (w === excludeWord);
        return w;
      }

      function generateGrid() {
        filterCandidates();

        gridEl.innerHTML = "";
        resultsEl.textContent = "";
        finished = false;
        errorCount = 0;
        errorDisplay.textContent = "0";

        totalRows = Math.max(3, Math.min(parseInt(rowsInput.value, 10) || 3, 60));
        cellsPerRow = Math.max(6, Math.min(parseInt(cellsInput.value, 10) || 6, 40));
        rowTotalDisplay.textContent = totalRows.toString();

        targetWords = chooseTargets(totalRows);
        currentRowIndex = 0;
        currentTarget = targetWords[0];
        targetDisplay.textContent = currentTarget;
        rowDisplay.textContent = "1";
        startTime = performance.now();

        for (let r = 0; r < totalRows; r++) {
          const rowWrapper = document.createElement("div");
          rowWrapper.className = "row-wrapper";
          rowWrapper.setAttribute("role", "listitem");

          const label = document.createElement("div");
          label.className = "row-label";
          label.textContent = "Row " + (r + 1);
          rowWrapper.appendChild(label);

          const row = document.createElement("div");
          row.className = "row";
          row.dataset.rowIndex = r.toString();

          const guaranteedIndex = Math.floor(Math.random() * cellsPerRow);

          for (let c = 0; c < cellsPerRow; c++) {
            const cell = document.createElement("div");
            cell.className = "cell";

            const btn = document.createElement("button");
            btn.type = "button";
            btn.tabIndex = 0;

            let word;
            if (c === guaranteedIndex) {
              word = targetWords[r];
            } else {
              word = randomFiller(targetWords[r]);
            }

            btn.textContent = word;
            btn.dataset.word = word;
            btn.dataset.rowIndex = r.toString();

            btn.addEventListener("click", handleCellClick);

            cell.appendChild(btn);
            row.appendChild(cell);
          }

          rowWrapper.appendChild(row);
          gridEl.appendChild(rowWrapper);
        }

        const firstButton = gridEl.querySelector("button");
        if (firstButton) {
          firstButton.focus();
        }
      }

      function handleCellClick(evt) {
        if (finished) return;

        const btn = evt.currentTarget;
        const word = btn.dataset.word;
        const rowIndex = parseInt(btn.dataset.rowIndex, 10);
        const cellDiv = btn.parentElement;

        if (rowIndex !== currentRowIndex) {
          markCell(cellDiv, "wrong");
          errorCount++;
          errorDisplay.textContent = errorCount.toString();
          return;
        }

        if (word === currentTarget) {
          markCell(cellDiv, "correct");
          advanceRow();
        } else {
          markCell(cellDiv, "wrong");
          errorCount++;
          errorDisplay.textContent = errorCount.toString();
        }
      }

      function markCell(cellDiv, type) {
        cellDiv.classList.remove("correct", "wrong");
        cellDiv.classList.add(type);
        if (type === "wrong") {
          setTimeout(function () {
            cellDiv.classList.remove("wrong");
          }, 300);
        }
      }

      function advanceRow() {
        currentRowIndex++;
        if (currentRowIndex >= totalRows) {
          finishTask();
          return;
        }
        currentTarget = targetWords[currentRowIndex];
        targetDisplay.textContent = currentTarget;
        rowDisplay.textContent = (currentRowIndex + 1).toString();

        const nextRowWrapper = gridEl.querySelector(
          ".row-wrapper:nth-child(" + (currentRowIndex + 1) + ")"
        );
        if (nextRowWrapper && nextRowWrapper.scrollIntoView) {
          nextRowWrapper.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }

      function finishTask() {
        finished = true;
        const endTime = performance.now();
        const seconds = ((endTime - startTime) / 1000).toFixed(1);
        resultsEl.innerHTML =
          "<p>Completed " +
          totalRows +
          " rows in <strong>" +
          seconds +
          " seconds</strong> with <strong>" +
          errorCount +
          " errors</strong>.</p>";
      }

      startBtn.addEventListener("click", generateGrid);

      generateGrid();
    })();
  </script>

</body>
</html>
